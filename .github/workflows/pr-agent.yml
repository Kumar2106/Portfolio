name: AI PR Review (Gemini)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    # Skip bot events to prevent loops. PR events run as usual (fork PRs get no secrets). Comment-triggered
    # runs are limited to slash commands on PRs from the repo owner or collaborators, so strangers on this
    # public repo cannot spend the Gemini API quota.
    if: >-
      ${{ github.event.sender.type != 'Bot' && (
        github.event_name == 'pull_request' ||
        (github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/') &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Run PR Agent
        # Pinned to the v0.46.0 release commit; a mutable branch ref would get the Gemini key on every upstream push
        uses: the-pr-agent/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975 # v0.46.0
        env:
          # GitHub Token provided automatically by Actions for commenting
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Google Gemini Authentication (stored in repository secrets)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # LiteLLM routing to Google Gemini free tier
          CONFIG.model: "gemini/gemini-3.8-flash"
          CONFIG.fallback_models: '["gemini/gemini-3.5-flash", "gemini/gemini-2.5-flash"]'

          # Automatically run review on PR events
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
