AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS Serverless Application Model (SAM) for Kumar Aditya Portfolio Contact Form API.
  Exposes Lambda via API Gateway and dispatches notification emails via Amazon SES.

Parameters:
  RecipientEmail:
    Type: String
    Default: ka09934147002@gmail.com
    Description: Destination email address where contact messages are delivered.
  SenderEmail:
    Type: String
    Default: no-reply@aditya.weinventify.com
    Description: SES sender address on a verified domain identity (DKIM-signed, no mailbox required).
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name.
  AllowedOrigin:
    Type: String
    Default: https://aditya.weinventify.com
    Description: Browser origin permitted to call the contact API (CORS).

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Environment:
      Variables:
        RECIPIENT_EMAIL: !Ref RecipientEmail
        SENDER_EMAIL: !Ref SenderEmail
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  ContactApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      # Stage-wide ceiling shared by all callers: caps SES volume and cost if the public endpoint is abused.
      # It is not per-client isolation; per-IP limiting would need an AWS WAF rate-based rule.
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
        # Each POST sends one email: keep it within the SES sandbox send rate (1/sec). CORS preflight
        # (OPTIONS) stays on the looser default above so it never consumes the POST allowance.
        - ResourcePath: '/~1contact'
          HttpMethod: POST
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 1
      # API Gateway's own errors (e.g. 429 from throttling) carry CORS headers so the browser can read them
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: index.handler
      Description: Validates contact form submissions and delivers emails via Amazon SES.
      Policies:
        - Statement:
            # SES authorizes SendEmail against the sender identity and, while in the sandbox, also against each
            # recipient identity. Allowing this account's identities but pinning ses:FromAddress lets the function
            # send only as SenderEmail, in the sandbox and after production access alike.
            - Sid: SESSendEmailAccess
              Effect: Allow
              Action:
                - ses:SendEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              # Matches the bare address or any display name around it ("Name <address>"), so the policy holds
              # whichever form SES evaluates; the sending address itself stays pinned to SenderEmail.
              Condition:
                StringLike:
                  ses:FromAddress:
                    - !Ref SenderEmail
                    - !Sub '*<${SenderEmail}>'
      Events:
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref ContactApi
            Path: /health
            Method: get
        ContactPost:
          Type: Api
          Properties:
            RestApiId: !Ref ContactApi
            Path: /contact
            Method: post
        ContactOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ContactApi
            Path: /contact
            Method: options

Outputs:
  ContactApiEndpoint:
    Description: Public API Gateway endpoint URL for the contact form
    Value: !Sub "https://${ContactApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/contact"
  HealthApiEndpoint:
    Description: Public API Gateway health check endpoint URL
    Value: !Sub "https://${ContactApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/health"
  ContactFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt ContactFunction.Arn
  ContactFunctionIamRole:
    Description: Implicit IAM Role created for the Contact function
    Value: !GetAtt ContactFunctionRole.Arn
