AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS Serverless Application Model (SAM) for Kumar Aditya Portfolio Contact Form API.
  Exposes Lambda via API Gateway and dispatches notification emails via Amazon SES.

Parameters:
  RecipientEmail:
    Type: String
    Default: ka09934147002@gmail.com
    Description: Destination email address where contact messages are delivered.
  SenderEmail:
    Type: String
    Default: ka09934147002@gmail.com
    Description: Verified SES sender email address.
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name.
  AllowedOrigin:
    Type: String
    Default: https://aditya.weinventify.com
    Description: Browser origin permitted to call the contact API (CORS).

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Environment:
      Variables:
        RECIPIENT_EMAIL: !Ref RecipientEmail
        SENDER_EMAIL: !Ref SenderEmail
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  ContactApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      # Stage-wide ceiling shared by all callers: caps SES volume and cost if the public endpoint is abused.
      # It is not per-client isolation; per-IP limiting would need an AWS WAF rate-based rule.
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: index.handler
      Description: Validates contact form submissions and delivers emails via Amazon SES.
      Policies:
        - Statement:
            - Sid: SESSendEmailAccess
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref ContactApi
            Path: /health
            Method: get
        ContactPost:
          Type: Api
          Properties:
            RestApiId: !Ref ContactApi
            Path: /contact
            Method: post
        ContactOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ContactApi
            Path: /contact
            Method: options

Outputs:
  ContactApiEndpoint:
    Description: Public API Gateway endpoint URL for the contact form
    Value: !Sub "https://${ContactApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/contact"
  HealthApiEndpoint:
    Description: Public API Gateway health check endpoint URL
    Value: !Sub "https://${ContactApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/health"
  ContactFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt ContactFunction.Arn
  ContactFunctionIamRole:
    Description: Implicit IAM Role created for the Contact function
    Value: !GetAtt ContactFunctionRole.Arn
